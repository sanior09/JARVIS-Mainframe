[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
addopts = -v --ignore=tests/simulate_user_test.py --ignore=tests/test_island.py --ignore=tests/test_ui.py --ignore=tests/test_evolution.py --ignore=tests/test_limitless.py --ignore=tests/test_stt.py --ignore=tests/test_vad_bargein_sync.py
markers =
    unit: Fast unit tests with no external dependencies
    voice: Voice STT, TTS, and VAD Barge-in tests
    agent: Windows Computer Use and RPA Automation tests
    integration: Integration tests between multiple subsystems
pythonpath = . modules
