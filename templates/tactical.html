<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TACTICAL COMMAND | J.A.R.V.I.S.</title>
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js & Globe.gl -->
    <script src="//unpkg.com/three"></script>
    <script src="//unpkg.com/globe.gl"></script>
    
    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="/static/static/tactical.css">
</head>
<body class="bg-black text-cyan-400 font-mono h-screen w-screen overflow-hidden flex flex-col">

    <!-- HEADER -->
    <header class="hud-panel p-4 flex justify-between items-center border-b border-cyan-500/30">
        <div class="flex items-center gap-4">
            <div class="animate-pulse w-3 h-3 bg-red-500 rounded-full"></div>
            <h1 class="text-2xl font-bold tracking-[0.3em] uppercase">Tactical Command Matrix</h1>
        </div>
        <div class="text-right text-sm">
            <div id="system-time">00:00:00 UTC</div>
            <div class="text-xs text-cyan-700">NACHAPOL INDUSTRIES - AUTHORIZED ACCESS ONLY</div>
        </div>
    </header>

    <!-- MAIN GRID -->
    <main class="flex-1 grid grid-cols-3 grid-rows-2 gap-4 p-4 min-h-0">
        
        <!-- PROJECT VALKYRIE (CYBER THREATS) -->
        <div class="col-span-2 row-span-2 hud-panel flex flex-col relative overflow-hidden">
            <div class="p-3 border-b border-cyan-500/30 flex justify-between">
                <h2 class="font-bold tracking-widest text-red-400">PROJECT VALKYRIE // GLOBAL CYBER THREATS</h2>
                <span id="soc-status" class="px-2 py-1 text-xs bg-green-900/50 text-green-400 rounded">SOC: NORMAL</span>
            </div>
            <div id="globeViz" class="flex-1 w-full h-full cursor-crosshair"></div>
            
            <!-- Floating Threat Log -->
            <div class="absolute bottom-4 left-4 w-1/3 max-h-48 overflow-y-auto bg-black/60 border border-cyan-900 p-2 text-xs">
                <div class="mb-1 border-b border-cyan-800 pb-1 text-cyan-500">RECENT THREAT LOGS</div>
                <div id="threat-log-container" class="flex flex-col gap-1"></div>
            </div>
        </div>

        <!-- PROJECT AEGIS (SPACE) -->
        <div class="col-span-1 row-span-1 hud-panel flex flex-col overflow-hidden">
            <div class="p-3 border-b border-cyan-500/30 flex justify-between">
                <h2 class="font-bold tracking-widest text-blue-400">PROJECT AEGIS // SSA</h2>
                <span id="weather-status" class="text-xs text-blue-300">SWx: NORMAL</span>
            </div>
            <div class="flex-1 overflow-y-auto p-2 text-xs space-y-2" id="sat-container">
                <div class="text-center text-cyan-700 mt-10">Acquiring TLE Data...</div>
            </div>
        </div>

        <!-- PROJECT HEIMDALL (DISASTERS) -->
        <div class="col-span-1 row-span-1 hud-panel flex flex-col overflow-hidden">
            <div class="p-3 border-b border-cyan-500/30">
                <h2 class="font-bold tracking-widest text-orange-400">PROJECT HEIMDALL // GEO DISASTERS</h2>
            </div>
            <div id="mapViz" class="flex-1 w-full h-full z-0"></div>
        </div>

    </main>

    <script src="/static/static/tactical.js"></script>
</body>
</html>
